---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: nexus-v30-backend
spec:
  selector:
    app: nexus-v30-backend
  ports:
    - name: http
      port: 3001
      targetPort: 3001
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    app: nexus-web
spec:
  selector:
    app: nexus-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
