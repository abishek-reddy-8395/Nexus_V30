# External Secrets Operator — Vault SecretStore
# Syncs Vault secrets → Kubernetes secrets automatically.
# Rotated secrets propagate to pods without restart (via projected volume).

---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.nexus-internal.svc:8200"
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: nexus-v30-backend
          serviceAccountRef:
            name: nexus-v30-backend
            namespace: nexus

---
# ExternalSecret — pulls secrets from Vault into nexus-secrets K8s secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexus-v30-production-secrets
  namespace: nexus
spec:
  refreshInterval: 15m   # Re-sync every 15 minutes (picks up rotations)
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: nexus-v30-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: jwt-secret
      remoteRef: { key: nexus/production, property: jwt_secret }
    - secretKey: database-url
      remoteRef: { key: nexus/production, property: database_url }
    - secretKey: redis-url
      remoteRef: { key: nexus/production, property: redis_url }
    - secretKey: kafka-brokers
      remoteRef: { key: nexus/production, property: kafka_brokers }
    - secretKey: gemini-api-key
      remoteRef: { key: nexus/production, property: gemini_api_key }
    - secretKey: openai-api-key
      remoteRef: { key: nexus/production, property: openai_api_key }
    - secretKey: encryption-key
      remoteRef: { key: nexus/production, property: encryption_key }
