# Nexus V30 — Kubernetes Deployments
# Apply: kubectl apply -f infrastructure/kubernetes/deployments/

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-v30-backend
  namespace: nexus
  labels:
    app: nexus-v30-backend
    version: "30.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nexus-v30-backend
  template:
    metadata:
      labels:
        app: nexus-v30-backend
    spec:
      containers:
        - name: backend
          image: nexus-v30-backend:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexus-v30-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: nexus-v30-secrets
                  key: redis-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nexus-v30-secrets
                  key: jwt-secret
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexus-v30-secrets
                  key: gemini-api-key
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu:    "250m"
            limits:
              memory: "1Gi"
              cpu:    "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds:       15
          readinessProbe:
            httpGet:
              path: /readiness
              port: 3001
            initialDelaySeconds: 5
            periodSeconds:       10

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-v30-web
  namespace: nexus
  labels:
    app: nexus-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-web
  template:
    metadata:
      labels:
        app: nexus-web
    spec:
      containers:
        - name: web
          image: nexus-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: https://api.nexus.app
            - name: NEXT_PUBLIC_WS_URL
              value: wss://api.nexus.app
          resources:
            requests:
              memory: "256Mi"
              cpu:    "200m"
            limits:
              memory: "512Mi"
              cpu:    "500m"

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexus-v30-backend-hpa
  namespace: nexus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexus-v30-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type:               AverageUtilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type:               AverageUtilization
          averageUtilization: 80

---
# HPA for web tier
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexus-v30-web-hpa
  namespace: nexus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexus-v30-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type:               AverageUtilization
          averageUtilization: 70

---
# PodDisruptionBudget — ensure at least 1 backend pod always available during deploys
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nexus-v30-backend-pdb
  namespace: nexus
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nexus-v30-backend

---
# PodDisruptionBudget for web
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nexus-v30-web-pdb
  namespace: nexus
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nexus-web
