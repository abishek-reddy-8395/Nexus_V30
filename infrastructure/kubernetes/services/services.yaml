# Nexus V30 — Kubernetes Services + Ingress

---
apiVersion: v1
kind: Service
metadata:
  name: nexus-v30-backend
  namespace: nexus
spec:
  selector:
    app: nexus-v30-backend
  ports:
    - name: http
      port: 3001
      targetPort: 3001
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: nexus-v30-web
  namespace: nexus
spec:
  selector:
    app: nexus-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-v30-ingress
  namespace: nexus
  annotations:
    kubernetes.io/ingress.class:              nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer:           letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket support
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  tls:
    - hosts:
        - nexus.app
        - api.nexus.app
      secretName: nexus-tls
  rules:
    - host: api.nexus.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-v30-backend
                port: { number: 3001 }
    - host: nexus.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-v30-web
                port: { number: 3000 }
