# Nexus V30 — Kubernetes Secrets
#
# DO NOT commit real values. Use one of:
#   1. External Secrets Operator (recommended): syncs from AWS Secrets Manager / Vault
#   2. Sealed Secrets: encrypt with kubeseal before committing
#   3. Manual kubectl apply (CI/CD reads from GitHub Actions secrets)
#
# To create manually:
#   kubectl create secret generic nexus-secrets -n nexus \
#     --from-literal=jwt-secret="$(openssl rand -base64 48)" \
#     --from-literal=database-url="postgresql://nexus:PASS@postgres:5432/nexus" \
#     --from-literal=redis-url="redis://:PASS@redis:6379" \
#     --from-literal=gemini-api-key="YOUR_KEY"

---
# Example External Secrets Operator config (sync from AWS Secrets Manager)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexus-v30-secrets
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: nexus-v30-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: nexus/production
        property: jwt_secret
    - secretKey: database-url
      remoteRef:
        key: nexus/production
        property: database_url
    - secretKey: redis-url
      remoteRef:
        key: nexus/production
        property: redis_url
    - secretKey: gemini-api-key
      remoteRef:
        key: nexus/production
        property: gemini_api_key
    - secretKey: kafka-brokers
      remoteRef:
        key: nexus/production
        property: kafka_brokers
