# Nexus V30 — Kubernetes RBAC
# Principle of least privilege: each service account has only the permissions it needs.

---
# Backend service account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-v30-backend
  namespace: nexus
  annotations:
    # For AWS IRSA (IAM Role for Service Accounts) — attach ECR/Secrets Manager read role
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/nexus-v30-backend-role"

---
# Backend role — can only read its own secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexus-v30-backend-role
  namespace: nexus
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [nexus-secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [nexus-config]
    verbs: [get, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexus-v30-backend-binding
  namespace: nexus
subjects:
  - kind: ServiceAccount
    name: nexus-v30-backend
    namespace: nexus
roleRef:
  kind: Role
  name: nexus-v30-backend-role
  apiGroup: rbac.authorization.k8s.io

---
# Web service account — no cluster permissions needed
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-v30-web
  namespace: nexus
automountServiceAccountToken: false
