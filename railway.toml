[build]
builder = "nixpacks"
buildCommand = "pnpm install --no-frozen-lockfile && pnpm --filter @nexus-v30/backend exec tsc --skipLibCheck --noEmit false || true && pnpm --filter @nexus-v30/backend run build -- --skipLibCheck"

[deploy]
startCommand = "pnpm --filter @nexus-v30/backend run start"
restartPolicyType = "on_failure"
